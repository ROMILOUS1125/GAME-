<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>牛奶贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#f8f1e4;
  position:relative;
}

/* ===== 牛奶背景 + 热气效果 ===== */
.milk-bg{
  position:fixed;
  inset:0;
  background: radial-gradient(ellipse at center, #fffdf8 0%, #f5efe0 40%, #ebe0c9 100%);
  z-index:0;
  overflow:hidden;
}
/* 牛奶浓稠波纹 */
.milk-wave{
  position:absolute;
  width:200%;
  height:100%;
  top:0;
  left:-50%;
  background: radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.6) 0%, transparent 50%);
  animation: wave 8s ease-in-out infinite;
}
.milk-wave:nth-child(2){
  animation-delay:-4s;
  opacity:0.5;
}
@keyframes wave{
  0%,100%{transform:translateX(-10%) scaleY(1);}
  50%{transform:translateX(10%) scaleY(1.05);}
}
/* 热气 */
.steam{
  position:absolute;
  bottom:20%;
  width:40px;
  height:120px;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.6) 0%, transparent 70%);
  filter:blur(8px);
  animation: steam 4s ease-in infinite;
  opacity:0;
}
.steam.s1{left:25%;animation-delay:0s;}
.steam.s2{left:45%;animation-delay:1.2s;}
.steam.s3{left:65%;animation-delay:2.4s;}
.steam.s4{left:80%;animation-delay:0.8s;}
@keyframes steam{
  0%{opacity:0; transform:translateY(20px) scale(0.8);}
  30%{opacity:0.7;}
  100%{opacity:0; transform:translateY(-150px) scale(1.5);}
}

/* ===== 游戏区域 ===== */
.game-wrap{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
#gameCanvas{
  border-radius:20px;
  box-shadow: 0 8px 32px rgba(139,119,79,0.2), inset 0 2px 8px rgba(255,255,255,0.8);
  background: rgba(255,253,248,0.85);
  backdrop-filter: blur(2px);
}

/* 分数 */
.score-bar{
  color:#8b7355;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 1px 2px #fff;
}

/* ===== 虚拟摇杆 ===== */
.joystick-area{
  width:160px;
  height:160px;
  position:relative;
  border-radius:50%;
  background: rgba(255,255,255,0.5);
  border: 2px solid rgba(200,180,140,0.5);
  box-shadow: inset 0 2px 8px rgba(255,255,255,0.8);
  touch-action:none;
  user-select:none;
}
.joystick-stick{
  width:60px;
  height:60px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background: linear-gradient(145deg, #fff, #e8dcc4);
  box-shadow: 0 4px 12px rgba(139,119,79,0.3);
  transition: transform 0.1s;
}

/* ===== 上传按钮区 ===== */
.upload-bar{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:10;
  flex-wrap:wrap;
  justify-content:center;
}
.upload-btn{
  padding:6px 12px;
  background:rgba(255,255,255,0.8);
  border:1px solid #d4c7a8;
  border-radius:8px;
  color:#8b7355;
  font-size:12px;
  cursor:pointer;
}
.upload-btn input{display:none;}

.tip-text{
  position:fixed;
  bottom:10px;
  font-size:12px;
  color:#a89472;
  z-index:5;
}
</style>
</head>
<body>

<!-- 牛奶背景 -->
<div class="milk-bg">
  <div class="milk-wave"></div>
  <div class="milk-wave"></div>
  <div class="steam s1"></div>
  <div class="steam s2"></div>
  <div class="steam s3"></div>
  <div class="steam s4"></div>
</div>

<!-- 上传按钮 -->
<div class="upload-bar">
  <label class="upload-btn">
    上传蛇身图片
    <input type="file" id="snakeUpload" accept="image/*">
  </label>
  <label class="upload-btn">
    上传食物图片
    <input type="file" id="foodUpload" accept="image/*">
  </label>
  <button class="upload-btn" onclick="restartGame()">重新开始</button>
</div>

<!-- 游戏主体 -->
<div class="game-wrap">
  <div class="score-bar">得分：<span id="score">0</span></div>
  <canvas id="gameCanvas" width="320" height="320"></canvas>
  <div class="joystick-area" id="joystick">
    <div class="joystick-stick" id="stick"></div>
  </div>
</div>

<div class="tip-text">摇杆控制方向 · 上传图片自动裁成圆形</div>

<script>
// ========== 游戏配置 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const gridCount = canvas.width / gridSize;

let snake = [{x:8,y:8}];
let direction = {x:1,y:0};
let nextDirection = {x:1,y:0};
let food = {x:12,y:8};
let score = 0;
let gameLoop;
let gameSpeed = 180;

// 图片资源
let snakeImg = null;
let foodImg = null;

// ========== 图片上传 + 自动裁圆 ==========
function processImage(file, callback){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // 裁成圆形
      const size = Math.min(img.width, img.height);
      const roundCanvas = document.createElement('canvas');
      roundCanvas.width = gridSize;
      roundCanvas.height = gridSize;
      const rctx = roundCanvas.getContext('2d');
      rctx.beginPath();
      rctx.arc(gridSize/2, gridSize/2, gridSize/2, 0, Math.PI*2);
      rctx.clip();
      rctx.drawImage(img, (img.width-size)/2, (img.height-size)/2, size, size, 0,0, gridSize, gridSize);
      callback(roundCanvas);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('snakeUpload').onchange = e => {
  if(e.target.files[0]){
    processImage(e.target.files[0], img => snakeImg = img);
  }
};
document.getElementById('foodUpload').onchange = e => {
  if(e.target.files[0]){
    processImage(e.target.files[0], img => foodImg = img);
  }
};

// ========== 绘制函数 ==========
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 绘制食物
  if(foodImg){
    ctx.drawImage(foodImg, food.x*gridSize, food.y*gridSize, gridSize, gridSize);
  }else{
    ctx.fillStyle = '#d4a574';
    ctx.beginPath();
    ctx.arc(food.x*gridSize + gridSize/2, food.y*gridSize + gridSize/2, gridSize/2-2, 0, Math.PI*2);
    ctx.fill();
  }

  // 绘制蛇
  snake.forEach((seg, i) => {
    if(snakeImg){
      ctx.drawImage(snakeImg, seg.x*gridSize, seg.y*gridSize, gridSize, gridSize);
    }else{
      ctx.fillStyle = i===0 ? '#8b7355' : '#b8a07e';
      ctx.beginPath();
      ctx.arc(seg.x*gridSize + gridSize/2, seg.y*gridSize + gridSize/2, gridSize/2-1, 0, Math.PI*2);
      ctx.fill();
    }
  });
}

// ========== 游戏逻辑 ==========
function update(){
  direction = {...nextDirection};
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

  // 撞墙
  if(head.x<0 || head.x>=gridCount || head.y<0 || head.y>=gridCount){
    gameOver();
    return;
  }
  // 撞自己
  if(snake.some(s => s.x===head.x && s.y===head.y)){
    gameOver();
    return;
  }

  snake.unshift(head);

  // 吃食物
  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById('score').textContent = score;
    spawnFood();
  }else{
    snake.pop();
  }
}

function spawnFood(){
  while(true){
    const x = Math.floor(Math.random()*gridCount);
    const y = Math.floor(Math.random()*gridCount);
    if(!snake.some(s => s.x===x && s.y===y)){
      food = {x,y};
      break;
    }
  }
}

function gameOver(){
  clearInterval(gameLoop);
  alert(`游戏结束！得分：${score}\n点确定重新开始`);
  restartGame();
}

function restartGame(){
  snake = [{x:8,y:8}];
  direction = {x:1,y:0};
  nextDirection = {x:1,y:0};
  score = 0;
  document.getElementById('score').textContent = 0;
  spawnFood();
  clearInterval(gameLoop);
  gameLoop = setInterval(()=>{ update(); draw(); }, gameSpeed);
}

// ========== 摇杆控制 ==========
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyActive = false;
let joyCenter = {x:0,y:0};
const joyRadius = 50;

function getPos(e){
  const touch = e.touches ? e.touches[0] : e;
  const rect = joystick.getBoundingClientRect();
  return {
    x: touch.clientX - rect.left - rect.width/2,
    y: touch.clientY - rect.top - rect.height/2
  };
}

function setDirection(dx, dy){
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 10 && direction.x !== -1) nextDirection = {x:1,y:0};
    else if(dx < -10 && direction.x !== 1) nextDirection = {x:-1,y:0};
  }else{
    if(dy > 10 && direction.y !== -1) nextDirection = {x:0,y:1};
    else if(dy < -10 && direction.y !== 1) nextDirection = {x:0,y:-1};
  }
}

function onStart(e){
  e.preventDefault();
  joyActive = true;
  onMove(e);
}
function onMove(e){
  if(!joyActive) return;
  e.preventDefault();
  const pos = getPos(e);
  const dist = Math.sqrt(pos.x*pos.x + pos.y*pos.y);
  
  if(dist > joyRadius){
    pos.x = pos.x / dist * joyRadius;
    pos.y = pos.y / dist * joyRadius;
  }
  
  stick.style.transform = `translate(calc(-50% + ${pos.x}px), calc(-50% + ${pos.y}px))`;
  setDirection(pos.x, pos.y);
}
function onEnd(e){
  joyActive = false;
  stick.style.transform = 'translate(-50%, -50%)';
}

joystick.addEventListener('mousedown', onStart);
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onEnd);
joystick.addEventListener('touchstart', onStart, {passive:false});
document.addEventListener('touchmove', onMove, {passive:false});
document.addEventListener('touchend', onEnd);

// 键盘兼容
document.addEventListener('keydown', e=>{
  switch(e.key){
    case 'ArrowUp': if(direction.y!==1) nextDirection={x:0,y:-1}; break;
    case 'ArrowDown': if(direction.y!==-1) nextDirection={x:0,y:1}; break;
    case 'ArrowLeft': if(direction.x!==1) nextDirection={x:-1,y:0}; break;
    case 'ArrowRight': if(direction.x!==-1) nextDirection={x:1,y:0}; break;
  }
});

// 启动游戏
restartGame();
</script>
</body>
</html>
